<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rock-paper-seissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section>
      
      <figure>
        <figcaption class="title"><strong>Rock Paper Seissors</strong></figcaption>
        <button class="gameButton js-rock">✊</button>
        <button class="gameButton js-paper">🖐</button>
        <button class="gameButton js-scissors">✌</button>
        <p class="js-result result"></p>
        <p class="js-moves moves"></p>
        <p class="js-score"></p>
        <button class="reset-button">Reset Score</button>
        <button class="autoplay">Auto Play</button>
        <button class="stop-autoplay">Stop Auto Play</button>
      </figure>
    </section>
  </main>
  <script src="script.js" defer >

  </script>
</body>
</html>
